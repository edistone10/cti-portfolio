# --- detection ------------------------------------------------------------------------------
- id: C43
  section: detection
  statement: Microsoft recommends alerting on LockScreenContentServer.exe running from any path other than C:\Windows\SystemApps.
  evidence:
  - source: S10
    quote: Alert on LockScreenContentServer.exe executing from non-standard paths (anything other than C:\Windows\SystemApps).
  - source: S3
    quote: Alert on LockScreenContentServer[.]exe executing from non-standard paths to identify this activity across your
      environment.
  - source: S7
    quote: monitoring ‘LockScreenContentServer.exe’ outside its normal path
- id: C44
  section: detection
  statement: Microsoft recommends restricting PowerShell and the Run dialog for standard users via AppLocker, App Control
    for Windows or Group Policy.
  evidence:
  - source: S10
    quote: Use AppLocker, Application Control for Windows, or Group Policy to restrict PowerShell execution for standard
      users.
  - source: S8
    quote: restrict PowerShell and Run dialog execution for standard users through AppLocker, Application Control for Windows,
      or Group Policy
  - source: S4
    quote: organizations should restrict PowerShell and Run dialog execution for standard users through methods like Group
      Policy, Application Control for Windows, or AppLocker.
- id: C45
  section: detection
  statement: Microsoft and the BSI recommend PowerShell script block logging and Constrained Language Mode.
  evidence:
  - source: S10
    quote: Enable PowerShell script block logging to detect and analyze obfuscated or encoded commands
  - source: S10
    quote: Enforce use of PowerShell Constrained Language Mode where possible
  - source: S1
    quote: Aktivierung von PowerShell Script Block Logging zur Dokumentation von PowerShell Prozessen
  - source: S1
    quote: Betrieb von PowerShell im Constrained Language Mode, um die Ausführung gefährlicher PowerShell-Befehle zu verhindern
- id: C46
  section: detection
  statement: Affected hosts should be treated as entry points into the network rather than isolated systems; credentials
    reachable from them, including domain admin accounts, should be rotated.
  evidence:
  - source: S10
    quote: Organizations that find indicators of this campaign should assume the attacker has network-level access through
      the compromised host. Credential rotation should be prioritized for any credentials accessible from the affected machine,
      including domain admin accounts if the host was domain-joined.
  - source: S1
    quote: Betrachtung kompromittierter Rechner als Einstiegspunkte ins Netzwerk für lateral Movement, nicht als isolierte
      Systeme.
  - source: S7
    quote: If compromise is confirmed, it is advisable to investigate for lateral movement and to rotate credentials, including
      domain admin credentials, if accessible from the infected host.
- id: C47
  section: detection
  statement: Microsoft Defender detects the chain among others as Trojan:Win32/TermFix, Trojan:Win32/ClickFix, Trojan:Win32/Posilod
    and Trojan:Python/Indigo.SA.
  evidence:
  - source: S10
    quote: Microsoft Defender Antivirus – Trojan:Win32/ClickFix.* – Trojan:Win32/TermFix.*
  - source: S10
    quote: Microsoft Defender Antivirus – Trojan:Win32/Posilod.* – Trojan:Win64/DLLHijack.DAB!MTB
  - source: S10
    quote: Microsoft Defender Antivirus – Trojan:Python/Indigo.SA
- id: C48
  section: detection
  statement: Proofpoint's Madjar considers broad Run/Terminal restrictions rarely practical and recommends user training,
    blocking malicious sites and detecting suspicious execution instead.
  evidence:
  - source: S4
    quote: argues that wide restrictions on Run dialog and Terminal access are "rarely practical."
  - source: S4
    quote: Defenses should therefore focus on training users not to execute commands copied from untrusted websites, blocking
      malicious sites before users reach them, and detecting suspicious execution when prevention fails.
judgments:
- id: J1
  statement: TerminalFix was likely the initial access vector in the August 2026 compromise of two Berlin Senate administrations,
    but no primary source states this explicitly.
  confidence: moderate
  likelihood: likely
  based_on: [C27, C28, C37, C38]
  rationale: The BSI advisory describes a compromised state institution in August whose attack matches TerminalFix, and
    the BSI's same-day Mastodon post ties its Berlin incident work to that advisory. heise reads this as confirmation. Neither
    the advisory nor the State of Berlin names Berlin or TerminalFix together, so the link rests on inference.
- id: J2
  statement: TerminalFix access is very likely monetised through ransomware and data extortion by the Vice Spider / Rhysida
    ecosystem rather than through infostealers.
  confidence: moderate
  likelihood: very likely
  based_on: [C3, C23, C39, C40, C42]
  rationale: The chain ends in network access, not credential theft from one host; the BSI reports attempted ransomware
    and double extortion and ties LoremIpsumLoader in the campaign to the Rhysida group; BlueVoyant independently reports
    the same group moving to Terminal-based ClickFix lures. Microsoft itself did not observe follow-up activity.
- id: J3
  statement: The published hashes and domains will very likely age quickly; detections built on the behaviour - LockScreenContentServer.exe
    outside SystemApps, pythonw.exe running a tunnel script, a single long-lived WebSocket over 443 - are the more durable
    control.
  confidence: moderate
  likelihood: very likely
  based_on: [C10, C17, C18, C26, C42]
  rationale: The operators already switched delivery once after a disruption (signed installers to ClickFix), use a failover
    domain for payloads and rely on legitimate signed binaries and runtimes whose abuse is visible in behaviour, not in hashes.
- id: J4
  statement: German public-sector victims are likely the result of opportunistic, financially motivated targeting rather
    than a campaign aimed specifically at Germany, so European organisations in all sectors face comparable exposure.
  confidence: moderate
  likelihood: likely
  based_on: [C1, C8, C36, C41]
  rationale: Microsoft sees victims across multiple industries, the lure script sat on several hundred websites, the BSI
    calls the actors opportunistic and financially motivated, and the Rhysida leak site shows no significant German focus.
- id: J5
  statement: The Terminal-versus-Run distinction is of limited defensive value; controls and awareness must cover every
    paste-and-run path, not only the Run dialog.
  confidence: moderate
  likelihood: likely
  based_on: [C2, C4, C42, C48]
  rationale: Microsoft presents Terminal as the differentiator, while Proofpoint points to Terminal lures since 2024 and
    BlueVoyant sees another group use the same Terminal paste flow; blocking Win+R alone would leave the TerminalFix path open.
gaps:
- No primary source explicitly names TerminalFix as the initial access vector in Berlin. The BSI advisory speaks of "a state
  institution"; the State of Berlin names neither the vector nor Rhysida; the link rests on the BSI Mastodon post and heise's
  reading of it (see J1).
- The advisory title speaks of German institutions in the plural; which other institutions were affected is not public.
- The BlueVoyant analyses on Lorem Ipsum / Rapid Brigantine (referenced by the BSI) blocked automated retrieval (HTTP 403);
  that link relies on Dark Reading's summary and was not checked against the original.
- No public IOC overlap links Microsoft's TerminalFix samples to LoremIpsumLoader or to the Berlin intrusion; whether the
  Berlin chain used the same files and infrastructure is unknown.
- Whether ransomware was actually deployed or executed in Berlin has not been stated by any source; the BSI speaks of attempts
  in reports it received.
- How the Berlin victim reached the compromised website (phishing e-mail, search, watering hole) is not documented by an official
  source.
- Number of victims and of compromised websites currently serving the lure is unknown; the BSI only refers to several hundred
  websites in historical data.
- Microsoft is inconsistent on the locale coverage of the reconnaissance script (English/Spanish vs. English/Spanish/German, C25).
- abuse.ch (ThreatFox, MalwareBazaar) had no entries for the tag TerminalFix at collection time.
- The Register article (S9) could not be extracted and was not used.
