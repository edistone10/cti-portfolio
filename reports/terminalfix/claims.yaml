  - source: S16
    quote: Hochgradig personalisiertes Phishing, das z.B. als echte E-Mail der Senatsverwaltung Berlin getarnt ist.
  - source: S16
    quote: Identitätsdiebstahl und Betrugsdelikte mit gestohlenen Dokumenten oder Kontaktdaten
  - source: S14
    quote: Das BSI weist zudem auf eine erhöhte Bedrohung durch gezielte Phishing-Angriffe nach dem Datenabfluss hin.
# --- attribution ----------------------------------------------------------------------------
- id: C37
  section: attribution
  date: 2026-09-04
  statement: The BSI published advisory BITS-B 2026-287419-1032 on TerminalFix with criticality 2/yellow (measures must be
    taken promptly), and on the same day stated on Mastodon that it is closely involved in the Berlin incident response, linking
    the post to the TerminalFix advisory.
  evidence:
