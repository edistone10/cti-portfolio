- id: C36
  section: victimology
  statement: For the Rhysida leak site, the BSI (citing a commercial provider) reports that 92 % of listings are followed
    by a data release, on average after 11 days; there is no significant focus on Germany, a strong focus on education and
    health, and public administration ranks among the top five sectors.
  evidence:
  - source: S1
    quote: Nach Kenntnislage eines kommerziellen Dienstleisters des BSI folgt in 92 % der Fälle auf die Nennung auf der Leak-Seite
      Rhysida auch eine Datenveröffentlichung. Dabei vergehen zwischen Nennung auf der Leak-Seite und Veröffentlichung von
      gestohlenen Daten im Durchschnitt 11 Tage. Eine Auswertung der Leak-Seite zeigt keinen signifikanten Fokus auf Deutschland
      als Region. Die Angreifer zeigen einen starken Fokus auf den Bildungs- und Gesundheitssektor.
  - source: S5
    quote: As the BSI reports, citing an unnamed external service provider, in 92 percent of cases where criminals threaten
      publication, it actually occurs.
  - source: S5
    quote: Rhysida therefore primarily focuses on the healthcare and education sectors – government agencies are still among
      the five most frequently mentioned target types.
- id: C49
  section: victimology
  statement: After the leak, the BSI warned of follow-on attacks, in particular highly personalised phishing disguised as
