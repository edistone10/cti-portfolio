  attack:
  - T1005
  - T1539
  - T1555.004
  - T1113
  - T1082
  evidence:
  - source: S1
    quote: cryptocurrency wallet files from more than 30 wallet applications, ... Discord login tokens, ... Telegram
      session data, ... Windows credential store ... any document whose name contains words like "password," "seed,"
      "wallet," or "recovery", ... a screenshot of every monitor connected to the machine, and ... a detailed profile
