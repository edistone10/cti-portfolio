- id: C35
  section: attribution
  statement: Delphos assesses with high confidence that the loader was produced by the Cruciferra PUROSANGUE crypter
    package (documented by Proofpoint in 2025) or a close derivative.
  evidence:
  - source: S1
    quote: Delphos Labs assesses with high confidence that the loader was produced by the Cruciferra PUROSANGUE
