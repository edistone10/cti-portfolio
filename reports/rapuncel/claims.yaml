- id: C38
  section: detection
  statement: 'Recommended hunts target driver lineage and behaviour: the NvFsFilter service, writes of nvfsflt64.sys,
    drivers whose signer names Henan Dafeng or contain CnCrypt, the \\.\Alinubx device, and a driver load followed
    by security-process terminations.'
  evidence:
  - source: S1
    quote: Microsoft-attested drivers whose Authenticode programName contains the Henan Dafeng identity or whose
      version resources contain CnCrypt.
  - source: S1
    quote: Service creation for NvFsFilter or file writes to C:\Windows\System32\drivers\nvfsflt64.sys.
  - source: S1
    quote: Driver load followed by termination of security processes through kernel activity.
  - source: S6
    quote: a driver whose signing details name Henan Dafeng Software or contain "CnCrypt"
- id: C39
  section: detection
  statement: Further behavioural indicators are vsdbg.exe spawning non-Microsoft child processes, PE files with
    an oversized .reloc section, and the files browser_decryption.log / sends.log in %TEMP%.
  evidence:
  - source: S1
    quote: vsdbg.exe spawning non-Microsoft child processes, and a PE file whose raw .reloc section is far larger
      than its declared relocation size
  - source: S1
    quote: browser_decryption.log / sends.log | Rapuncel forensic footprint in %TEMP% output folder
- id: C40
  section: detection
  statement: Microsoft's vulnerable driver blocklist matches known hashes, so a renamed or recompiled driver is
    not covered; the effective control is blocking the driver, its signer or lineage.
  evidence:
  - source: S1
    quote: There were 0 of 20 SHA256 matches because the blocklist is a list of known bad hashes. New malware can
      avoid matching by creating a new hash with techniques such as a filename swap or a recompilation.
  - source: S1
    quote: 'The control is policy enforcement: block the driver, deny the signer or lineage, or prevent the drop.
      If the driver is trusted and not blocklisted, administrator rights are enough to install and use it.'
  - source: S6
    quote: a renamed or recompiled driver produces a new hash that the list does not carry
- id: C41
  section: detection
  statement: The exfiltration IP should be treated as historical context, not a standalone block rule.
  evidence:
  - source: S1
    quote: Treat this IP as historical and shared-infrastructure context, not a standalone block rule without corroborating
      request framing.
- id: C42
  section: detection
  statement: Affected users should treat browser credentials, wallets, sessions and Credential Manager contents
    as exposed, change them from a clean device, and remediate the kernel-level compromise offline or in Safe Mode.
  evidence:
  - source: S1
    quote: Treat every credential stored in the browser on that machine as exposed
  - source: S1
    quote: Change those credentials from a separate, known-clean device rather than the affected one
  - source: S5
    quote: affected systems may also require offline or Safe Mode remediation rather than relying solely on conventional
      antivirus cleanup.
judgments:
- id: J1
  statement: The operators will very likely continue the campaign with new brands, infrastructure and a renamed
    or recompiled driver, so the hash and domain IOCs in this report will age quickly.
  confidence: moderate
  likelihood: very likely
  based_on:
  - C1
  - C6
  - C22
  - C29
  - C30
  - C31
  - C34
  rationale: One kit serves 40+ brands, the redirect layer lets the operator swap payload servers at will, infrastructure
    was maintained after detection, and the driver was already re-identified once (CcProtect -> Alinubx). A parallel
    BoryptGrab-lineage wave with 292 repositories shows the model scales.
- id: J2
  statement: Controls that rely on hashes, file names or reputation (VirusTotal, the Microsoft blocklist, hash-based
    LOLDrivers rules) will very likely miss the next variant of this driver; signer- and lineage-based driver
    blocking is the more durable control.
  confidence: moderate
  likelihood: very likely
  based_on:
  - C5
  - C21
  - C22
  - C23
  - C40
  rationale: A filename and identity swap alone dropped VirusTotal detections from 7 to 0, neither the original
    nor the renamed driver was blocklisted, and the Microsoft attestation remained valid.
- id: J3
  statement: Rapuncel is likely one strand of the broader BoryptGrab ecosystem of SEO-poisoned GitHub lures rather
    than an isolated campaign. Russian-language indicators have been reported for earlier BoryptGrab waves, not for
    Rapuncel itself; attribution to a specific actor is not possible on current evidence.
  confidence: moderate
  likelihood: likely
  based_on:
  - C33
  - C34
  - C36
  - C37
  rationale: Shared lure brand, identical collection artifacts and fake badge texts connect the waves; the Russian-language
    indicators come from the related BoryptGrab reporting, not from Rapuncel itself, and the loader is a commercial
    crypter that several crews can buy.
- id: J4
  statement: The kernel-level stage is likely to succeed mainly where users work with local administrator rights;
    enforcing standard-user accounts sharply reduces, but does not remove, the risk.
  confidence: moderate
  likelihood: likely
  based_on:
  - C14
  - C18
  - C40
  rationale: The loader needs elevation (UAC bypass techniques) before it can install the driver, and the researchers
    state that administrator rights are enough to install and use the trusted driver. Whether any of the three elevation
    methods works from a standard-user context is not documented.
gaps:
- No victim count is published and the ~40 impersonated brands are not named; it is unknown whether DACH-specific
  software or brands were among the lures.
- The Delphos Labs companion analysis and the SOCFortress write-up (blocked, HTTP 403) were not stored as sources;
  technical details rely on the LastPass report, which incorporates the joint findings.
- The list of 145 targeted AV/EDR process names is not published, so it is unknown which products common in DACH
  organisations are covered.
- 'PPL bypass: Delphos states the driver can defeat Protected Process Light, while LOLDrivers states that successful
  termination of protected processes is not established. Not independently tested.'
- The LastPass report contains inconsistent target counts (25+/30+ vs. 19+/34+ browsers/wallets).
- Which three elevation methods the loader uses, and whether any works for standard users, is not documented.
- Start date of the Rapuncel wave is unknown (the report says only that the campaign has been running for months).
- Purpose of the Chrome PreferenceMACs registry-key deletion seen in sandbox runs of the terminal domains is unclear.
- abuse.ch (ThreatFox, MalwareBazaar) had no entries for Rapuncel or Alinubx at collection time; hashes come only
  from the LastPass report and LOLDrivers and were not independently analysed.
- Whether Microsoft has added Alinubx.sys or the CcProtect lineage to the vulnerable driver blocklist since 17 September
  2026 was not checked.
