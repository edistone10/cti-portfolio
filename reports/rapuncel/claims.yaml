  - source: S2
    quote: Data from 30 cryptocurrency wallets ... Discord, Steam, and Telegram session credentials ... Windows
      Credential Manager contents ... Screenshots from every connected monitor
  - source: S3
    quote: In addition to passwords, the malware collects all information about crypto wallets, Discord and Steam
