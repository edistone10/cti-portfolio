- id: C28
  section: infrastructure
  statement: Stolen data is zipped and uploaded to 2.26.126[.]50 via 'POST /upload' HTTP formatting over raw TCP;
    the loader and driver do not contact external infrastructure.
  attack:
  - T1560
  - T1041
  evidence:
  - source: S1
    quote: 'The Rapuncel stealer exfiltration pattern: ZIP upload to 2.26.126[.]50 using POST /upload HTTP/1.1 over
      raw TCP.'
  - source: S1
    quote: The delivery loader and Alinubx kernel driver do not communicate with external infrastructure in this
      deployment.
  - source: S2
    quote: The stolen information is compressed and uploaded to an external endpoint at '2.26.126[.]50' using an
      HTTP-formatted request sent over raw TCP.
- id: C29
  section: infrastructure
  statement: A Cloudflare-fronted traffic director (istatlmenus[.]com) supplies the payload server at runtime, so
    the operator can switch payload servers without touching the GitHub lures.
  evidence:
  - source: S1
    quote: A separate Cloudflare-fronted server (istatlmenus[.]com) acts as the dynamic traffic director for the
      chain.
  - source: S1
    quote: This means the operator can redirect victims to a different payload server at any time simply by updating
      that single endpoint without touching any of the GitHub lure infrastructure.
  - source: S4
    quote: A separate server behind Cloudflare then chose where to send the final malware. This meant the attackers
      could switch to a new malware server without changing the GitHub pages.
- id: C30
  section: infrastructure
  statement: Payload servers albinofennel[.]com and hanselarinmusky[.]com served the ZIP; albinofennel[.]com served
