# Evidence for the report in this folder: every factual statement (claim) with verbatim quotes
# from its sources. Source IDs (S<n>) are resolved in sources.csv; the report numbers them [n].
claims:
- id: C1
  section: summary
  statement: LastPass TIME and Delphos Labs identified and disrupted a multi-stage malware delivery campaign that
    impersonated at least 40 companies on GitHub; LastPass tracks the infostealer as Rapuncel.
  evidence:
  - source: S1
    quote: identified and disrupted a multi-stage malware delivery campaign impersonating at least 40 companies
      on GitHub
  - source: S1
    quote: LastPass is internally tracking the infostealer as Rapuncel.
  - source: S2
    quote: LastPass and Delphos Labs uncovered the campaign, which they report impersonates the password manager
      brand and at least 39 other companies.
  - source: S5
    quote: Investigators found that the same infrastructure was being used to impersonate at least 40 companies.
- id: C2
  section: summary
  statement: 'The campaign was brand impersonation only: no LastPass system, service or customer vault was compromised,
    and GitHub is not a LastPass distribution channel.'
  evidence:
  - source: S1
    quote: No LastPass system, service, or customer vault was involved or compromised.
  - source: S1
    quote: Official LastPass Authenticator is available through lastpass.com and the official app stores. GitHub
      is not a LastPass distribution channel.
  - source: S5
    quote: The company stressed that its own systems, services, and customer vaults were not compromised, and that
      GitHub is not an official distribution channel for LastPass Authenticator.
- id: C3
  section: timeline
  date: '2026-08-13'
  statement: LastPass TIME identified a fraudulent GitHub organisation impersonating LastPass Authenticator.
  evidence:
  - source: S1
    quote: On August 13, 2026, the LastPass TIME Team identified a fraudulent GitHub organization impersonating
      LastPass Authenticator
  - source: S4
    quote: LastPass’s Threat Intelligence, Mitigation, and Escalation team spotted the fake GitHub organization
      on August 13, 2026.
  - source: S5
    quote: LastPass first detected the operation on August 13, 2026, after identifying a fraudulent GitHub organization
      at github[.]com/LastPass-Authenticator.
- id: C4
  section: timeline
  date: '2026-08-19'
  statement: Delphos reported Alinubx.sys to Microsoft (MSRC); MSRC did not classify it as a vulnerability because
    the driver is not a Microsoft component and redirected the report to the driver submission (blocklist) channel.
  evidence:
  - source: S1
    quote: Delphos reported Alinubx.sys to Microsoft through the MSRC Researcher Portal on August 19, 2026. MSRC
      responded that the behavior does not meet its definition of a security vulnerability, since the driver is
      not a Microsoft-owned component
  - source: S4
    quote: Delphos flagged the sample to Microsoft on August 19.
- id: C5
  section: timeline
  date: '2026-08-20'
  statement: Neither Alinubx.sys nor the original CcProtect.sys was on Microsoft's vulnerable driver blocklist,
    and Alinubx.sys had 0/72 VirusTotal detections.
  evidence:
  - source: S1
    quote: Delphos checked 18 raw driver files from public BYOVD repositories, plus CcProtect.sys and Alinubx.sys,
      against the Microsoft DriverPolicy_Enforced.xml blocklist downloaded on August 20, 2026. There were 0 of 20
      SHA256 matches
  - source: S1
    quote: It scored 0 out of 72 on VirusTotal as of August 20, 2026, unchanged since July 2025.
  - source: S6
    quote: found neither the renamed driver nor the known original on it
- id: C6
  section: timeline
  date: '2026-09-10'
  statement: The traffic-director endpoint was still live and its content had changed between 27 August and 10 September,
    showing active maintenance of the campaign.
  evidence:
  - source: S1
    quote: The endpoint was confirmed live and serving a JavaScript redirect on September 10, 2026, and its content
      had changed between August 27 and September 10, confirming active ongoing maintenance.
  - source: S4
    quote: The endpoint also changed between August 27 and September 10, showing that the attackers were still actively
      maintaining the campaign.
- id: C7
  section: timeline
  date: '2026-09-17'
  statement: LastPass and Delphos Labs published their joint report; at publication Alinubx.sys was still not on
    the Microsoft vulnerable driver blocklist.
  evidence:
  - source: S1
    quote: At publication, Alinubx.sys was not present in the Microsoft vulnerable driver blocklist.
  - source: S3
    quote: At the time of publication, the reported file Alinubx.sys is not yet on the blocklist.
- id: C8
  section: distribution
  statement: Victims searching for terms like 'LastPass Authenticator download' found an SEO-optimised fake GitHub
    organisation page (github.com/LastPass-Authenticator) near the top of search results.
  attack:
  - T1608.006
  evidence:
  - source: S1
    quote: A user searching for "LastPass Authenticator download" or similar terms encounters a fraudulent GitHub
      organization page (github[.]com/LastPass-Authenticator) near the top of search results. The page is deliberately
      SEO-optimized and appeared to rank well.
  - source: S6
    quote: The lure is a fake GitHub page (github.com/LastPass-Authenticator) that ranks in search results
- id: C9
  section: distribution
  statement: A second, near-identical fake GitHub page advertised a 'macOS LastPass' product and was taken down
    before it could be analysed.
  evidence:
  - source: S1
    quote: There was also a second similar fake GitHub page (github[.]com/LastPass-S) which used nearly identical
      SEO-stuffed language about a "macOS LastPass" product.
  - source: S6
    quote: a near-identical second fake page for a "macOS LastPass" product was taken down
- id: C10
  section: distribution
  statement: The lure led to a GitHub Pages download portal showing fabricated trust badges such as 'VirusTotal
    Approved' and 'Secure Archive'.
  evidence:
  - source: S1
    quote: Clicking the button takes the victim to a GitHub Pages site (lastpass-authenticator[.]github[.]io) that
      displays a convincing download interface. The page shows fabricated trust signals (i.e., "Authorized Access,"
      "VirusTotal Approved," and "Secure Archive" badges)
  - source: S4
    quote: The download page also displayed fake trust badges, including “VirusTotal Approved.”
  - source: S3
    quote: The download leads to a GitHub Pages site, where signals like green tags and slogans such as “secure”,
      “Verified Access”, and “Secure Connection” suggest trustworthiness to the victims.
- id: C11
  section: distribution
  statement: Victims were routed through two further GitHub Pages accounts whose custom 404.html pages silently
    forwarded them via JavaScript, abusing GitHub Pages error handling as a covert redirector.
  evidence:
  - source: S1
    quote: the page silently routes the victim through two additional observed GitHub Pages accounts (i.e., edgarcostartqd[.]github[.]io
      and dallikilic54[.]github[.]io) that act as hidden waypoints.
  - source: S1
    quote: Each one uses a custom 404.html file containing JavaScript that captures the URL path and silently forwards
      the victim to the next stage.
  - source: S4
    quote: they were sent through two other GitHub Pages accounts that looked like broken 404 pages but secretly
      used JavaScript to redirect them to the next step.
  - source: S3
    quote: use modified 404.html files to abuse GitHub Pages’ error handling as a hidden redirect.
- id: C12
  section: distribution
  statement: The payload arrived as ZIP archives of 148 MB and 127.9 MB, inflated with junk DLLs so that size-limited
    scanners skip them.
  attack:
  - T1027.001
  evidence:
  - source: S1
    quote: 'The large file size is intentional: most automated security scanning tools have size limits and will
      skip files this large'
  - source: S1
    quote: Two large files (TitanStorage.dll and ProManager.dll) are pure junk and are included only to inflate
      the archive size further.
  - source: S2
    quote: victims receive ZIP archives with their size inflated to up to 148MB to evade security scans.
- id: C13
  section: infection_chain
  statement: The 'installer' is Microsoft's renamed vsdbg.exe debugger, which side-loads the malicious vsdbg.dll
    from the same folder when the victim runs it.
  attack:
  - T1204.002
  - T1574.001
  - T1036.005
  evidence:
  - source: S1
    quote: The victim runs what looks like a LastPass installer; however, it is actually Microsoft's own debugging
      tool (vsdbg.exe) renamed. When Windows loads this program, it automatically loads a companion file (vsdbg.dll)
      from the same folder.
  - source: S2
    quote: The installer inside the archives is a copy of the legitimate Microsoft Visual Studio CoreCLR Debugger,
      'vsdbg.exe,' renamed and configured to sideload a malicious DLL (vsdbg.dll).
  - source: S5
    quote: The malware abused a legitimate Microsoft debugging executable, vsdbg.exe, to load a malicious DLL through
      DLL side-loading.
- id: C14
  section: infection_chain
  statement: The loader tries three elevation methods (UAC bypass) and then runs as SYSTEM.
  attack:
  - T1548.002
  evidence:
  - source: S1
    quote: The malware attempts three different methods to obtain administrator-level access, exploiting built-in
      Windows features that allow programs to request elevated permissions. Once it succeeds, it runs as SYSTEM
  - source: S6
    quote: The loader then tries three ways to gain administrator rights, reaches SYSTEM
- id: C15
  section: infection_chain
  statement: The loader matches the Cruciferra PUROSANGUE feature set described by eSentire, which includes process
    hollowing into ServiceModelReg.exe; Delphos lists process hollowing as observed.
  attack:
  - T1055.012
  evidence:
  - source: S1
    quote: eSentire describes a Cruciferra package called PUROSANGUE that produces a NativeAOT side-loaded DLL with
      EDR/AV killing, COM Elevation Moniker UAC bypass, process hollowing into ServiceModelReg.exe, and 145 default
      AV/EDR process targets. Our loader contains the decrypted string C:\ExploitTests\purosangue.tx and matches
      every one of those features.
  - source: S1
    quote: '| T1055.012 | Process Injection: Process Hollowing |'
- id: C16
  section: infection_chain
  statement: The kernel driver is dropped as nvfsflt64.sys and registered as the service NvFsFilter, masquerading
    as an NVIDIA File System Filter Driver.
  attack:
  - T1543.003
  - T1036.005
  evidence:
  - source: S1
    quote: dropped to disk as nvfsflt64.sys under the service name NvFsFilter, disguised as an NVIDIA File System
      Filter Driver.
  - source: S2
    quote: The kernel driver is disguised as an NVIDIA component named 'nvfsflt64.sys' and registers as the NvFsFilter
      service.
- id: C17
  section: infection_chain
  statement: The malware persists as an auto-start Windows service and loops continuously, re-killing restarted
    security products and re-running the stealer on every boot.
  attack:
  - T1543.003
  evidence:
  - source: S1
    quote: 'The malware installs itself as a Windows service that starts automatically every time the computer boots.
      It then loops continuously: checking for security products, killing any that have restarted, and re-running
      the stealer.'
  - source: S2
    quote: Rapuncel persists across reboots via a Windows service, so any security tools that reactivate are killed
      again before the infostealer launches.
- id: C18
  section: capabilities
  statement: 'Alinubx.sys terminates a hardcoded list of 145 AV/EDR processes from kernel mode: the loader sends
    IOCTL 0x222024 with process IDs to \\.\Alinubx and the driver kills them with ZwTerminateProcess.'
  attack:
  - T1685
  evidence:
  - source: S1
    quote: The loader sends IOCTL 0x222024 with target process IDs. The driver resolves each target process with
      PsLookupProcessByProcessId, opens it with ObOpenObjectByPointer, and terminates it with ZwTerminateProcess.
  - source: S7
    quote: Alinubx.sys exposes IOCTL 0x222024 to request kernel-mode process termination through the device path
      \\.\Alinubx.
  - source: S2
    quote: the driver acts as an EDR killer that contains a hardcoded list of 145 antivirus and EDR processes that
      it aims to terminate.
- id: C19
  section: capabilities
  statement: According to Delphos, opening processes with KernelMode access bypasses the user-mode access check,
    so the driver can defeat Protected Process Light (PPL).
  evidence:
  - source: S1
    quote: The driver calls ObOpenObjectByPointer with AccessMode=KernelMode, which bypasses the normal user-mode
      SeAccessCheck path at handle-open time.
  - source: S1
    quote: That is why it can defeat Protected Process Light (PPL); the protection many security products rely on
      to survive an administrator.
- id: C20
  section: capabilities
  statement: LOLDrivers states that successful termination of protected processes by Alinubx.sys is not established.
  evidence:
  - source: S7
    quote: Access requires the driver to be loaded and its device to be accessible; successful termination of protected
      processes is not established.
- id: C21
  section: capabilities
  statement: The driver is signed through the Microsoft Windows Hardware Compatibility Publisher chain with a March
    2023 signing timestamp, years before the campaign.
  attack:
  - T1553.002
  evidence:
  - source: S1
    quote: The driver is signed through the Microsoft Windows Hardware Compatibility Publisher chain, with a signing
      timestamp of March 2023, years before this campaign.
  - source: S6
    quote: signed through the Microsoft Windows Hardware Compatibility Publisher chain, with a signing date of March 2023
- id: C22
  section: capabilities
  statement: Alinubx.sys is a renamed, identity-swapped copy of CcProtect.sys v1.32 from the CnCrypt product (Henan
    Dafeng Software), a driver already catalogued on LOLDrivers as a BYOVD process killer with public PoC code.
  evidence:
  - source: S1
    quote: The driver is a renamed, identity-swapped version of CcProtect.sys, a driver already listed on LOLDrivers
      with public proof-of-concept killer code. Same product string, same version, same submitter, same process-kill
      primitive.
  - source: S1
    quote: The version resources and VirusTotal pivots tie Alinubx.sys to the CnCrypt/CcProtect driver line from
      Henan Dafeng Software Co., Ltd.
  - source: S8
    quote: CnCrypt CcProtect.sys is a signed kernel driver used by BlackSnufkin BYOVD research as a process-killer
      provider.
- id: C23
  section: capabilities
  statement: 'The rename lowered antivirus detection: the known CcProtect.sys had 7 of about 70 detections in August,
    the renamed driver none; by 10 September Alinubx.sys had 3 detections.'
  evidence:
  - source: S6
    quote: 7 of about 70 engines flagging it in August, while the renamed driver showed zero
  - source: S1
    quote: VirusTotal's last analysis for Alinubx.sys showed 3 malicious detections and 71 undetected engines, on
      September 10, 2026.
- id: C24
  section: capabilities
  attack:
  - T1014
  - T1055.004
  - T1557
  observed: false
  statement: The driver also contains dormant rootkit, DLL-injection and traffic-redirection features that require
    a configuration file (Alinubx.ccf); they were not activated in this deployment.
  evidence:
  - source: S1
    quote: 'The driver carries more than this deployment used: file and registry hiding, process and driver interception,
      DLL interception, network control, port redirection, WFP traffic handling, APC-based usermode DLL injection,
      and a rule configuration system based on \SystemRoot\Alinubx.ccf.'
  - source: S1
    quote: In this deployment, Alinubx acted as an AV killer and its broader functionality remained unconfigured.
      A future deployment with Alinubx.ccf present could activate the rest.
  - source: S2
    quote: The researchers noted that Alinubx.sys contains additional capabilities for file and registry hiding,
      DLL injection, driver and process interception, traffic manipulation, and port redirection, but do not appear
      to be activated in this campaign.
- id: C25
  section: capabilities
  statement: Rapuncel steals saved browser passwords and bypasses Chrome/Edge app-bound encryption by injecting
    a helper DLL that calls the browser's own decryption (Elevation) service.
  attack:
  - T1555.003
  evidence:
  - source: S1
    quote: the stealer reads saved passwords from more than 25 web browsers.
  - source: S1
    quote: it injects a small piece of code directly into the browser process. This code impersonates the browser
      itself and calls Chrome’s own password-decryption service from inside Chrome
  - source: S2
    quote: To bypass Google's app-bound encryption protection present on Chrome, Edge, and related browsers, Rapuncel
      injects a helper DLL into the app and invokes its own Elevation Service.
  - source: S5
    quote: The malware also included a method for bypassing the app-bound encryption used by Chrome and Edge by
      injecting code into the browser and requesting decryption from inside the trusted browser process.
- id: C26
  section: capabilities
  statement: Rapuncel also collects cryptocurrency wallet files, Discord, Steam and Telegram sessions, Windows Credential
