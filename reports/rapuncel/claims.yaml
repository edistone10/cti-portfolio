  - source: S11
    quote: language and hosting artifacts point to a Russian-speaking operator.
  - source: S6
    quote: a separate wave of nearly 300 such repositories in July
- id: C43
  section: background
  statement: Unlike Rapuncel, BoryptGrab also delivered a reverse SSH backdoor (TunnesshClient) and a Go downloader
