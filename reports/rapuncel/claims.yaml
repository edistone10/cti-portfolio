- id: C33
  section: background
  statement: 'Trend Micro documented BoryptGrab in March 2026: a stealer spread through over a hundred SEO-optimised
    fake GitHub repositories, with Russian-language comments and Russia-located IPs suggesting a possible origin.'
  evidence:
  - source: S10
    quote: The BoryptGrab campaign uses fake SEO‑optimized GitHub repositories and deceptive download pages to distribute
      a data‑stealing malware family
  - source: S10
    quote: searching for the software tool patterns leads to over a hundred public Github repositories delivering
      malware.
  - source: S10
    quote: Malware code from different stages of the attack contains Russian-language comments and/or log messages.
      IP addresses associated with the campaign are also located in Russia, suggesting a possible origin for the
      attacker.
  - source: S3
    quote: the security provider states that comments, log messages, and IP addresses in the components found by
      Trend Micro point to a Russian origin.
- id: C34
